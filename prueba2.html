<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Liturgia</title>
  
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <style>
    :root {
      --primary: #004b87;
      --secondary: #007bb5;
      --bg: #f0f4f8;
      --card: #ffffff;
      --text: #2c3e50;
      --success: #2e7d32;
      --amber: #f97316;
      --amber-bg: #fff7ed;
      --focus-blue: #0284c7;
      --focus-glow: rgba(2, 132, 199, 0.15);
      --green-bg: #f0fdf4;
      --danger: #ef4444;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    .main-container {
      display: flex;
      flex-wrap: wrap;
      gap: 25px;
      max-width: 1250px;
      margin: 0 auto;
      align-items: flex-start;
      justify-content: center;
    }

    .form-card {
      background: var(--card);
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      flex: 1 1 540px;
      max-width: 580px;
      box-sizing: border-box;
      position: relative;
    }

    .preview-card {
      background: var(--card);
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      flex: 1 1 420px;
      max-width: 500px;
      box-sizing: border-box;
      display: none; 
      position: sticky;
      top: 20px;
    }

    .progress-container {
      position: sticky;
      top: -25px;
      background-color: var(--card);
      padding: 15px 0 12px 0;
      margin-top: -25px;
      margin-bottom: 20px;
      z-index: 999;
      border-bottom: 1px solid #e2e8f0;
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 6px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background-color: #e2e8f0;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background-color: var(--secondary);
      border-radius: 4px;
      transition: width 0.3s ease, background-color 0.3s ease;
    }

    h2, h3 { color: var(--primary); margin-top: 10px; }

    .section-title {
      background: #e8f4fc;
      color: var(--primary);
      padding: 10px 15px;
      border-radius: 6px;
      font-weight: bold;
      margin-top: 20px;
      margin-bottom: 15px;
      border-left: 4px solid var(--primary);
    }

    .field-row-2col {
      display: flex;
      flex-direction: column;
      gap: 0px;
    }

    @media (min-width: 640px) {
      .field-row-2col {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
      }
    }

    .field-group {
      background: #fafafa;
      border: 1px solid #e2e8f0;
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 12px;
      box-sizing: border-box;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 13px;
    }

    .input-wrapper {
      position: relative;
      display: block;
      width: 100%;
    }

    input[type="text"], input[type="number"], input[type="date"] {
      width: 100%;
      padding: 0 75px 0 10px;
      box-sizing: border-box;
      border-radius: 6px;
      font-size: 13px;
      height: 38px;
      line-height: 38px;
      outline: none;
      transition: all 0.2s ease-in-out;
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
    }

    .field-hint {
      display: block;
      font-size: 11px;
      color: #64748b;
      margin-top: 4px;
      font-weight: 500;
    }

    .field-hint.error {
      color: var(--danger);
      font-weight: 600;
    }

    .st-incomplete {
      border: 1.5px solid var(--amber) !important;
      background-color: var(--amber-bg);
    }

    .st-focus {
      border: 2px solid var(--focus-blue) !important;
      background-color: #ffffff;
      box-shadow: 0 0 0 3px var(--focus-glow);
    }

    .st-complete {
      border: 1.5px solid var(--success) !important;
      background-color: var(--green-bg);
      padding-right: 35px !important;
    }

    .input-badge {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 11px;
      font-weight: 700;
      pointer-events: none;
      user-select: none;
    }

    .badge-required {
      color: #c2410c;
      background: #ffedd5;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #fed7aa;
    }

    .badge-check {
      color: var(--success);
      font-size: 14px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-export-jpg { background-color: var(--success); color: white; }
    .btn-whatsapp { background-color: #25d366; color: white; }
    .btn-reset { background-color: #e2e8f0; color: #475569; }
    .btn-reset:hover { background-color: #cbd5e1; color: #1e293b; }

    button:disabled {
      background-color: #cbd5e1 !important;
      color: #94a3b8 !important;
      cursor: not-allowed !important;
      opacity: 0.7;
    }

    canvas {
      width: 100%;
      height: auto;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <div class="main-container">

    <!-- COLUMNA IZQUIERDA: FORMULARIO -->
    <div class="form-card">
      
      <div class="progress-container">
        <div class="progress-header">
          <span>Progreso del formulario</span>
          <span id="progressText">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressBar"></div>
        </div>
      </div>

      <h2>Asistente de Liturgia</h2>

      <form id="liturgiaForm" autocomplete="off">
        
        <div class="section-title">1. Información General</div>
        
        <div class="field-row-2col">
          <div class="field-group">
            <label for="fecha">1. Fecha del Sermón:</label>
            <div class="input-wrapper">
              <input type="date" id="fecha" required>
              <span class="input-badge badge-required">Requerido</span>
            </div>
            <span class="field-hint" id="fechaHint">📅 Solo se permiten días sábados.</span>
          </div>

          <div class="field-group">
            <label for="lectura">3. Lectura Bíblica:</label>
            <div class="input-wrapper">
              <input type="text" id="lectura" placeholder="Ej: Juan 3:16" required>
              <span class="input-badge badge-required">Requerido</span>
            </div>
          </div>
        </div>

        <div class="section-title">2. Predicador y Himnos</div>

        <div class="field-group">
          <label for="predicador">2. Predicador Principal:</label>
          <div class="input-wrapper">
            <input type="text" id="predicador" placeholder="Ej: Pr. Juan Gómez" required>
            <span class="input-badge badge-required">Requerido</span>
          </div>
        </div>

        <div class="field-row-2col">
          <div class="field-group">
            <label for="himnoInicial">4. Himno Inicial (N°):</label>
            <div class="input-wrapper">
              <input type="text" id="himnoInicial" placeholder="Ej: 222" required>
              <span class="input-badge badge-required">Requerido</span>
            </div>
          </div>

          <div class="field-group">
            <label for="himnoFinal">5. Himno Final (N°):</label>
            <div class="input-wrapper">
              <input type="text" id="himnoFinal" placeholder="Ej: 333" required>
              <span class="input-badge badge-required">Requerido</span>
            </div>
          </div>
        </div>

        <div class="section-title">3. Asignaciones de Plataforma</div>

        <div class="field-group">
          <label for="acompanante1">6. Acompañante 1:</label>
          <div class="input-wrapper">
            <input type="text" id="acompanante1" placeholder="Ej: Hno. Carlos Ruiz" required>
            <span class="input-badge badge-required">Requerido</span>
          </div>
        </div>

        <div class="field-group">
          <label for="acompanante2">7. Acompañante 2:</label>
          <div class="input-wrapper">
            <input type="text" id="acompanante2" placeholder="Ej: Hna. Ana López" required>
            <span class="input-badge badge-required">Requerido</span>
          </div>
        </div>

        <div class="field-group">
          <label for="familiaOracion">8. Familia para Oración:</label>
          <div class="input-wrapper">
            <input type="text" id="familiaOracion" placeholder="Ej: Familia Méndez Castro" required>
            <span class="input-badge badge-required">Requerido</span>
          </div>
        </div>

        <div class="field-group">
          <label for="adoracionInfantil">9. Responsable Adoración Infantil:</label>
          <div class="input-wrapper">
            <input type="text" id="adoracionInfantil" placeholder="Ej: Hna. María Silva" required>
            <span class="input-badge badge-required">Requerido</span>
          </div>
        </div>

        <div class="field-group">
          <label for="mensajeMusical">10. Responsable Mensaje Musical:</label>
          <div class="input-wrapper">
            <input type="text" id="mensajeMusical" placeholder="Ej: Coro Central" required>
            <span class="input-badge badge-required">Requerido</span>
          </div>
        </div>

      </form>

      <div class="btn-group">
        <button type="button" id="btnExportar" class="btn-export-jpg" onclick="exportarJPG()" disabled>📸 Descargar</button>
        <button type="button" id="btnWhatsapp" class="btn-whatsapp" onclick="enviarWhatsApp()" disabled>📤 Compartir</button>
        <button type="button" id="btnLimpiar" class="btn-reset" onclick="limpiarFormulario()">🔄 Limpiar</button>
      </div>
    </div>

    <!-- COLUMNA DERECHA: VISTA PREVIA -->
    <div class="preview-card" id="previewCard">
      <h3>Vista Previa</h3>
      <canvas id="canvasLiturgia" width="864" height="1821"></canvas>
    </div>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('canvasLiturgia');
      const ctx = canvas.getContext('2d');
      const previewCard = document.getElementById('previewCard');
      const form = document.getElementById('liturgiaForm');
      const progressBar = document.getElementById('progressBar');
      const progressText = document.getElementById('progressText');
      const btnExportar = document.getElementById('btnExportar');
      const btnWhatsapp = document.getElementById('btnWhatsapp');
      const inputFecha = document.getElementById('fecha');
      const fechaHint = document.getElementById('fechaHint');
      const camposRequeridos = Array.from(document.querySelectorAll('#liturgiaForm input[required]'));

      const DIA_PERMITIDO = 6; // Sábado

      // COORDENADAS FIJAS PARA CADA CAMPO
      const COORDENADAS = {
        fecha: { x: 696, y: 488 },
        lectura: { x: 293, y: 761 },
        predicador: [
          { x: 260, y: 1532 },
          { x: 554, y: 1336 }
        ],
        himnoInicial: { x: 280, y: 816 },
        himnoFinal: { x: 280, y: 1380 },
        acompanante1: [
          { x: 300, y: 1560 },
          { x: 554, y: 758 },
          { x: 554, y: 812 },
          { x: 554, y: 1300 },
          { x: 554, y: 1426 },
          { x: 554, y: 1100 }
        ],
        acompanante2: [
          { x: 300, y: 1587 },
          { x: 554, y: 883 },
          { x: 554, y: 991 },
          { x: 554, y: 1224 },
          { x: 554, y: 1378 }
        ],
        familiaOracion: { x: 554, y: 930 },
        adoracionInfantil: { x: 554, y: 1019 },
        mensajeMusical: { x: 554, y: 1258 }
      };

      function validarFechaSabado(mostrarAlerta = true) {
        if (!inputFecha.value) return true;

        const partes = inputFecha.value.split('-');
        const fechaSeleccionada = new Date(partes[0], partes[1] - 1, partes[2]);
        const diaSemana = fechaSeleccionada.getDay();

        if (diaSemana !== DIA_PERMITIDO) {
          if (mostrarAlerta) {
            alert('⚠️ Por favor selecciona un día SÁBADO.');
          }
          inputFecha.value = '';
          fechaHint.className = 'field-hint error';
          fechaHint.innerText = '⚠️ Selección no válida: Debes elegir un SÁBADO.';
          return false;
        }

        fechaHint.className = 'field-hint';
        fechaHint.innerText = '📅 Solo se permiten días sábados.';
        return true;
      }

      inputFecha.addEventListener('change', () => {
        validarFechaSabado(true);
        actualizarInterfazEstado();
        guardarEnLocalStorage();
        solicitarActualizacionCanvas();
      });

      let plantilla = new Image();
      plantilla.src = 'plantilla.png';

      plantilla.onload = () => actualizarVistaPreviaDirecta();
      plantilla.onerror = () => { plantilla.src = 'CULTO DE.png'; };

      let renderTimeout;
      function solicitarActualizacionCanvas() {
        clearTimeout(renderTimeout);
        renderTimeout = setTimeout(actualizarVistaPreviaDirecta, 60);
      }

      function guardarEnLocalStorage() {
        const datosFormulario = {};
        camposRequeridos.forEach(input => {
          datosFormulario[input.id] = input.value;
        });
        localStorage.setItem('liturgiaData', JSON.stringify(datosFormulario));
      }

      function cargarDeLocalStorage() {
        const datosGuardados = localStorage.getItem('liturgiaData');
        if (datosGuardados) {
          try {
            const datos = JSON.parse(datosGuardados);
            Object.keys(datos).forEach(id => {
              const input = document.getElementById(id);
              if (input) input.value = datos[id];
            });
            validarFechaSabado(false);
          } catch (e) {
            console.error('Error al cargar localStorage', e);
          }
        }
      }

      function limpiarLocalStorage() {
        localStorage.removeItem('liturgiaData');
      }

      window.limpiarFormulario = function() {
        form.reset();
        limpiarLocalStorage();
        fechaHint.className = 'field-hint';
        fechaHint.innerText = '📅 Solo se permiten días sábados.';
        actualizarInterfazEstado();
        actualizarVistaPreviaDirecta();
      };

      function actualizarInterfazEstado() {
        let camposLlenos = 0;

        camposRequeridos.forEach(input => {
          const wrapper = input.parentElement;
          let badge = wrapper ? wrapper.querySelector('.input-badge') : null;

          if (input.value.trim() !== '') {
            camposLlenos++;
            if (document.activeElement !== input) {
              input.className = 'st-complete';
            }
            if (badge) {
              badge.className = 'input-badge badge-check';
              badge.innerText = '✓';
            }
          } else {
            if (document.activeElement !== input) {
              input.className = 'st-incomplete';
            }
            if (badge) {
              badge.className = 'input-badge badge-required';
              badge.innerText = 'Requerido';
            }
          }
        });

        const porcentaje = Math.round((camposLlenos / camposRequeridos.length) * 100);
        progressBar.style.width = `${porcentaje}%`;
        progressText.innerText = `${porcentaje}%`;

        const todoLleno = camposLlenos === camposRequeridos.length;
        progressBar.style.backgroundColor = todoLleno ? 'var(--success)' : 'var(--secondary)';
        btnExportar.disabled = !todoLleno;
        btnWhatsapp.disabled = !todoLleno;
        previewCard.style.display = todoLleno ? 'block' : 'none';
      }

      form.addEventListener('focusin', (e) => {
        if (e.target.matches('input[required]')) {
          e.target.className = 'st-focus';
        }
      });

      form.addEventListener('focusout', (e) => {
        if (e.target.matches('input[required]')) {
          actualizarInterfazEstado();
        }
      });

      form.addEventListener('input', (e) => {
        if (e.target !== inputFecha) {
          actualizarInterfazEstado();
          guardarEnLocalStorage();
          solicitarActualizacionCanvas();
        }
      });

      function dibujarTextoDirecto(idCampo, color, fuente, x, y, alineacion = 'left') {
        const elemento = document.getElementById(idCampo);
        if (!elemento || !elemento.value) return;

        ctx.font = fuente;
        ctx.fillStyle = color;
        ctx.textAlign = alineacion;
        ctx.fillText(elemento.value, x, y);
        ctx.textAlign = 'left';
      }

      function actualizarVistaPreviaDirecta() {
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';

        if (plantilla.complete && plantilla.naturalWidth !== 0) {
          ctx.drawImage(plantilla, 0, 0, canvas.width, canvas.height);
        } else {
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#64748b';
          ctx.font = '20px Arial';
          ctx.fillText('Cargando plantilla...', 330, 900);
          return;
        }

        // 1. Fecha
        const fechaRaw = document.getElementById('fecha').value;
        if (fechaRaw) {
          const partes = fechaRaw.split('-');
          const fechaObj = new Date(partes[0], partes[1] - 1, partes[2]);
          const fechaFormateada = fechaObj.toLocaleDateString('es-ES', { day: 'numeric', month: 'long' });

          ctx.font = 'bold 22px Arial';
          ctx.fillStyle = '#1e3a8a';
          ctx.textAlign = 'center';
          ctx.fillText(fechaFormateada, COORDENADAS.fecha.x, COORDENADAS.fecha.y);
          ctx.textAlign = 'left';
        }

        // 2. Predicador
        dibujarTextoDirecto('predicador', '#0f172a', 'bold 22px Arial', COORDENADAS.predicador[0].x, COORDENADAS.predicador[0].y);
        dibujarTextoDirecto('predicador', '#15803d', '20px Arial', COORDENADAS.predicador[1].x, COORDENADAS.predicador[1].y);

        // 3. Acompañante 1
        COORDENADAS.acompanante1.forEach((pt, i) => {
          dibujarTextoDirecto('acompanante1', '#0f172a', i === 0 ? 'bold 22px Arial' : 'bold 20px Arial', pt.x, pt.y);
        });

        // 4. Acompañante 2
        COORDENADAS.acompanante2.forEach((pt, i) => {
          dibujarTextoDirecto('acompanante2', '#0f172a', i === 0 ? 'bold 22px Arial' : 'bold 20px Arial', pt.x, pt.y);
        });

        // 5. Resto de campos
        dibujarTextoDirecto('lectura', '#1e40af', 'italic 20px Arial', COORDENADAS.lectura.x, COORDENADAS.lectura.y);
        dibujarTextoDirecto('himnoInicial', '#0f172a', 'bold 22px Arial', COORDENADAS.himnoInicial.x, COORDENADAS.himnoInicial.y);
        dibujarTextoDirecto('himnoFinal', '#0f172a', 'bold 22px Arial', COORDENADAS.himnoFinal.x, COORDENADAS.himnoFinal.y);
        dibujarTextoDirecto('familiaOracion', '#15803d', '20px Arial', COORDENADAS.familiaOracion.x, COORDENADAS.familiaOracion.y);
        dibujarTextoDirecto('adoracionInfantil', '#15803d', '20px Arial', COORDENADAS.adoracionInfantil.x, COORDENADAS.adoracionInfantil.y);
        dibujarTextoDirecto('mensajeMusical', '#15803d', '20px Arial', COORDENADAS.mensajeMusical.x, COORDENADAS.mensajeMusical.y);
      }

      window.exportarJPG = function() {
        actualizarVistaPreviaDirecta();
        limpiarLocalStorage();

        const esIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

        if (esIOS) {
          const dataUrl = canvas.toDataURL('image/jpeg', 1.0);
          const nuevaVentana = window.open();
          if (nuevaVentana) {
            nuevaVentana.document.write(`
              <html>
                <head>
                  <title>Liturgia HD</title>
                  <meta name="viewport" content="width=device-width, initial-scale=1.0">
                  <style>
                    body { margin: 0; background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; color: white; font-family: sans-serif; text-align: center; padding: 15px; box-sizing: border-box; }
                    img { max-width: 100%; height: auto; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
                    p { margin-top: 15px; font-size: 14px; color: #cbd5e1; }
                  </style>
                </head>
                <body>
                  <img src="${dataUrl}" alt="Liturgia">
                  <p>📲 <b>Mantén presionada la imagen</b> y selecciona <b>"Guardar en Fotos"</b>.</p>
                </body>
              </html>
            `);
          } else {
            alert('Por favor, permite las ventanas emergentes en Safari para guardar la imagen.');
          }
        } else {
          const fechaVal = document.getElementById('fecha').value || 'liturgia';
          const enlace = document.createElement('a');
          enlace.download = `Liturgia_${fechaVal.replace(/\s+/g, '_')}.jpg`;
          enlace.href = canvas.toDataURL('image/jpeg', 1.0);
          enlace.click();
        }
      };

      window.enviarWhatsApp = async function() {
        actualizarVistaPreviaDirecta();
        limpiarLocalStorage();

        const fechaRaw = document.getElementById('fecha').value;
        let fechaVal = '';

        if (fechaRaw) {
          const partes = fechaRaw.split('-');
          const fechaObj = new Date(partes[0], partes[1] - 1, partes[2]);
          fechaVal = fechaObj.toLocaleDateString('es-ES', { day: 'numeric', month: 'long' });
        }

        const predicadorVal = document.getElementById('predicador').value || '';
        const lecturaVal = document.getElementById('lectura').value || '';

        let mensaje = `📋 *LITURGIA DEL CULTO*\n`;
        if (fechaVal) mensaje += `📅 *Fecha:* ${fechaVal}\n`;
        if (predicadorVal) mensaje += `🎙️ *Predicador:* ${predicadorVal}\n`;
        if (lecturaVal) mensaje += `📖 *Lectura:* ${lecturaVal}\n`;
        mensaje += `\n📌 _Se adjunta la imagen con la programación completa._`;

        canvas.toBlob(async (blob) => {
          if (!blob) {
            exportarJPG();
            return;
          }

          const archivoImagen = new File([blob], `Liturgia_${fechaVal || 'culto'}.png`, { type: 'image/png' });

          if (navigator.canShare && navigator.canShare({ files: [archivoImagen] })) {
            try {
              await navigator.share({
                files: [archivoImagen],
                title: 'Liturgia del Culto',
                text: mensaje
              });
            } catch (err) {
              console.log('Compartir cancelado o no soportado:', err);
            }
          } 
          else if (navigator.clipboard && window.ClipboardItem) {
            try {
              const item = new ClipboardItem({ 'image/png': blob });
              await navigator.clipboard.write([item]);
              alert('¡Imagen HD copiada al portapapeles! Al abrir WhatsApp presiona Pegar.');
            } catch (e) {
              exportarJPG();
            }

            const mensajeURLEncoded = encodeURIComponent(mensaje);
            window.open(`https://api.whatsapp.com/send?text=${mensajeURLEncoded}`, '_blank');
          } 
          else {
            exportarJPG();
            const mensajeURLEncoded = encodeURIComponent(mensaje);
            window.open(`https://api.whatsapp.com/send?text=${mensajeURLEncoded}`, '_blank');
          }
        }, 'image/png');
      };

      cargarDeLocalStorage();
      actualizarInterfazEstado();
    });
  </script>
