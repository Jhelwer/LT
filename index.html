<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Liturgia</title>
  
  <!-- ÍCONO EN LA PESTAÑA DEL NAVEGADOR -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <style>
    :root {
      --primary: #004b87;
      --secondary: #007bb5;
      --bg: #f0f4f8;
      --card: #ffffff;
      --text: #2c3e50;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    .main-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .form-card, .preview-card {
      background: var(--card);
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      flex: 1;
      min-width: 380px;
    }

    h2, h3 { color: var(--primary); margin-top: 0; }

    .section-title {
      background: #e8f4fc;
      color: var(--primary);
      padding: 10px 15px;
      border-radius: 6px;
      font-weight: bold;
      margin-top: 20px;
      margin-bottom: 15px;
      border-left: 4px solid var(--primary);
    }

    .field-group {
      background: #fafafa;
      border: 1px solid #e2e8f0;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 13px;
    }

    input[type="text"], input[type="number"], input[type="date"] {
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 13px;
    }

    .input-text { width: 100%; margin-bottom: 0px; }

    /* CAMPOS DE COORDENADAS OCULTOS */
    .coord-inputs, .calibrator-box {
      display: none !important;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-export-jpg { background-color: #2e7d32; color: white; }
    .btn-whatsapp { background-color: #25d366; color: white; }

    /* ESTILOS PARA BOTONES DESHABILITADOS */
    button:disabled {
      background-color: #cbd5e1 !important;
      color: #94a3b8 !important;
      cursor: not-allowed !important;
      opacity: 0.7;
      box-shadow: none !important;
    }

    canvas {
      width: 100%;
      max-width: 480px;
      height: auto;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      display: block;
      margin: 0 auto;
    }

    .whatsapp-box {
      background: #e8f8f0;
      border: 1px solid #a3e635;
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="main-container">

    <!-- COLUMNA IZQUIERDA: FORMULARIO -->
    <div class="form-card">
      <h2>Asistente de Liturgia</h2>

      <form id="liturgiaForm">
        
        <!-- SECCIÓN 1: GENERAL -->
        <div class="section-title">1. Información General</div>
        
        <div class="field-group">
          <label>1. Fecha del Sermón:</label>
          <input type="date" id="fecha" class="input-text" value="" required>
          <div class="coord-inputs">
            <span>X:</span><input type="number" id="fecha_x" value="696">
            <span>Y:</span><input type="number" id="fecha_y" value="488">
          </div>
        </div>

        <!-- SECCIÓN 2: PREDICADOR -->
        <div class="section-title">2. Predicador y Mensaje</div>

        <div class="field-group">
          <label>2. Predicador Principal:</label>
          <input type="text" id="predicador" class="input-text" placeholder="Ej: Pr. Juan Gómez" value="" required>
          <div class="coord-inputs">
            <span>X1:</span><input type="number" id="predicador_x" value="260">
            <span>Y1:</span><input type="number" id="predicador_y" value="1532">
            <span>X2:</span><input type="number" id="predicador_x2" value="554">
            <span>Y2:</span><input type="number" id="predicador_y2" value="1336">
          </div>
        </div>

        <div class="field-group">
          <label>3. Lectura Bíblica:</label>
          <input type="text" id="lectura" class="input-text" placeholder="Ej: Juan 3:16" value="" required>
          <div class="coord-inputs">
            <span>X:</span><input type="number" id="lectura_x" value="293">
            <span>Y:</span><input type="number" id="lectura_y" value="761">
          </div>
        </div>

        <div class="field-group">
          <label>4. Himno Inicial (N°):</label>
          <input type="text" id="himnoInicial" class="input-text" placeholder="Ej: 222" value="" required>
          <div class="coord-inputs">
            <span>X:</span><input type="number" id="himnoInicial_x" value="280">
            <span>Y:</span><input type="number" id="himnoInicial_y" value="816">
          </div>
        </div>

        <div class="field-group">
          <label>5. Himno Final (N°):</label>
          <input type="text" id="himnoFinal" class="input-text" placeholder="Ej: 333" value="" required>
          <div class="coord-inputs">
            <span>X:</span><input type="number" id="himnoFinal_x" value="280">
            <span>Y:</span><input type="number" id="himnoFinal_y" value="1380">
          </div>
        </div>

        <!-- SECCIÓN 3: PLATAFORMA Y ACOMPAÑANTES -->
        <div class="section-title">3. Asignaciones de Plataforma</div>

        <div class="field-group">
          <label>6. Acompañante 1:</label>
          <input type="text" id="acompanante1" class="input-text" placeholder="Ej: Hno. Carlos Ruiz" value="" required>
          <div class="coord-inputs">
            <span>X1:</span><input type="number" id="acompanante1_x" value="300">
            <span>Y1:</span><input type="number" id="acompanante1_y" value="1560">
            <span>X2:</span><input type="number" id="acompanante1_x2" value="554">
            <span>Y2:</span><input type="number" id="acompanante1_y2" value="758">
            <span>X3:</span><input type="number" id="acompanante1_x3" value="554">
            <span>Y3:</span><input type="number" id="acompanante1_y3" value="812">
            <span>X4:</span><input type="number" id="acompanante1_x4" value="554">
            <span>Y4:</span><input type="number" id="acompanante1_y4" value="1300">
            <span>X5:</span><input type="number" id="acompanante1_x5" value="554">
            <span>Y5:</span><input type="number" id="acompanante1_y5" value="1426">
            <span>X6:</span><input type="number" id="acompanante1_x6" value="554">
            <span>Y6:</span><input type="number" id="acompanante1_y6" value="1100">
          </div>
        </div>

        <div class="field-group">
          <label>7. Acompañante 2:</label>
          <input type="text" id="acompanante2" class="input-text" placeholder="Ej: Hna. Ana López" value="" required>
          <div class="coord-inputs">
            <span>X1:</span><input type="number" id="acompanante2_x" value="300">
            <span>Y1:</span><input type="number" id="acompanante2_y" value="1587">
            <span>X2:</span><input type="number" id="acompanante2_x2" value="554">
            <span>Y2:</span><input type="number" id="acompanante2_y2" value="883">
            <span>X3:</span><input type="number" id="acompanante2_x3" value="554">
            <span>Y3:</span><input type="number" id="acompanante2_y3" value="991">
            <span>X4:</span><input type="number" id="acompanante2_x4" value="554">
            <span>Y4:</span><input type="number" id="acompanante2_y4" value="1224">
            <span>X5:</span><input type="number" id="acompanante2_x5" value="554">
            <span>Y5:</span><input type="number" id="acompanante2_y5" value="1378">
          </div>
        </div>

        <div class="field-group">
          <label>8. Familia para Oración:</label>
          <input type="text" id="familiaOracion" class="input-text" placeholder="Ej: Familia Méndez Castro" value="" required>
          <div class="coord-inputs">
            <span>X:</span><input type="number" id="familiaOracion_x" value="554">
            <span>Y:</span><input type="number" id="familiaOracion_y" value="930">
          </div>
        </div>

        <div class="field-group">
          <label>9. Responsable Adoración Infantil:</label>
          <input type="text" id="adoracionInfantil" class="input-text" placeholder="Ej: Hna. María Silva" value="" required>
          <div class="coord-inputs">
            <span>X:</span><input type="number" id="adoracionInfantil_x" value="554">
            <span>Y:</span><input type="number" id="adoracionInfantil_y" value="1019">
          </div>
        </div>

        <div class="field-group">
          <label>10. Responsable Mensaje Musical:</label>
          <input type="text" id="mensajeMusical" class="input-text" placeholder="Ej: Coro Central" value="" required>
          <div class="coord-inputs">
            <span>X:</span><input type="number" id="mensajeMusical_x" value="554">
            <span>Y:</span><input type="number" id="mensajeMusical_y" value="1258">
          </div>
        </div>

        <!-- CONFIGURACIÓN WHATSAPP -->
        <div class="whatsapp-box">
          <label for="numeroWA">📱 Número de WhatsApp (opcional con código de país):</label>
          <input type="text" id="numeroWA" class="input-text" placeholder="Ej: 51987654321 (vacío para seleccionar grupo/chat)">
        </div>

      </form>

      <div class="btn-group">
        <button type="button" id="btnExportar" class="btn-export-jpg" onclick="exportarJPG()" disabled>📸 Descargar</button>
        <button type="button" id="btnWhatsapp" class="btn-whatsapp" onclick="enviarWhatsApp()" disabled>📤 Compartir</button>
      </div>
    </div>

    <!-- COLUMNA DERECHA: VISTA PREVIA -->
    <div class="preview-card">
      <h3>Vista Previa</h3>
      <canvas id="canvasLiturgia" width="864" height="1821"></canvas>
    </div>

  </div>

  <script>
    const canvas = document.getElementById('canvasLiturgia');
    const ctx = canvas.getContext('2d');
    
    // CARGA AUTOMÁTICA DE PLANTILLA
    let plantilla = new Image();
    plantilla.src = 'plantilla.png';

    plantilla.onload = () => {
      actualizarVistaPrevia();
    };

    plantilla.onerror = () => {
      plantilla.src = 'CULTO DE.png';
    };

    // FUNCIÓN PARA VALIDAR SI EL FORMULARIO ESTÁ COMPLETO
    function validarFormulario() {
      const camposRequeridos = document.querySelectorAll('#liturgiaForm input[required]');
      let todoLleno = true;

      camposRequeridos.forEach(input => {
        if (!input.value.trim()) {
          todoLleno = false;
        }
      });

      const btnExportar = document.getElementById('btnExportar');
      const btnWhatsapp = document.getElementById('btnWhatsapp');

      btnExportar.disabled = !todoLleno;
      btnWhatsapp.disabled = !todoLleno;
    }

    // Escuchar cambios en inputs para actualizar vista y habilitar/deshabilitar botones
    document.querySelectorAll('#liturgiaForm input').forEach(input => {
      input.addEventListener('input', () => {
        actualizarVistaPrevia();
        validarFormulario();
      });
      input.addEventListener('change', () => {
        actualizarVistaPrevia();
        validarFormulario();
      });
    });

    // Validar en la carga inicial
    validarFormulario();

    // FUNCION PRINCIPAL DIBUJAR DATOS SOBRE COORDENADAS
    function actualizarVistaPrevia() {
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';

      if (plantilla.complete && plantilla.naturalWidth !== 0) {
        ctx.drawImage(plantilla, 0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#64748b';
        ctx.font = '20px Arial';
        ctx.fillText('Cargando plantilla...', 330, 900);
        return;
      }

      function dibujarTexto(idCampo, color, fuente, alineacion = 'left', sufijoX = '_x', sufijoY = '_y') {
        const elemento = document.getElementById(idCampo);
        if (!elemento) return;
        const texto = elemento.value;
        const elemX = document.getElementById(`${idCampo}${sufijoX}`);
        const elemY = document.getElementById(`${idCampo}${sufijoY}`);
        
        if (!elemX || !elemY) return;

        const x = parseInt(elemX.value) || 0;
        const y = parseInt(elemY.value) || 0;

        if (texto) {
          ctx.font = fuente;
          ctx.fillStyle = color;
          ctx.textAlign = alineacion;
          ctx.fillText(texto, x, y);
          ctx.textAlign = 'left';
        }
      }

      // 1. Fecha (Formateada a "DÍA de MES")
      const fechaRaw = document.getElementById('fecha').value;
      if (fechaRaw) {
        const partes = fechaRaw.split('-'); // [AAAA, MM, DD]
        const fechaObj = new Date(partes[0], partes[1] - 1, partes[2]);
        
        const fechaFormateada = fechaObj.toLocaleDateString('es-ES', {
          day: 'numeric',
          month: 'long'
        });

        const elemX = document.getElementById('fecha_x');
        const elemY = document.getElementById('fecha_y');
        if (elemX && elemY) {
          ctx.font = 'bold 22px Arial';
          ctx.fillStyle = '#1e3a8a';
          ctx.textAlign = 'center';
          ctx.fillText(fechaFormateada, parseInt(elemX.value) || 0, parseInt(elemY.value) || 0);
          ctx.textAlign = 'left';
        }
      }

      // 2. Predicador
      dibujarTexto('predicador', '#0f172a', 'bold 22px Arial', 'left', '_x', '_y');
      dibujarTexto('predicador', '#15803d', '20px Arial', 'left', '_x2', '_y2');

      // 3. Acompañante 1
      dibujarTexto('acompanante1', '#0f172a', 'bold 22px Arial', 'left', '_x', '_y');
      dibujarTexto('acompanante1', '#0f172a', 'bold 20px Arial', 'left', '_x2', '_y2');
      dibujarTexto('acompanante1', '#0f172a', 'bold 20px Arial', 'left', '_x3', '_y3');
      dibujarTexto('acompanante1', '#0f172a', 'bold 20px Arial', 'left', '_x4', '_y4');
      dibujarTexto('acompanante1', '#0f172a', 'bold 20px Arial', 'left', '_x5', '_y5');
      dibujarTexto('acompanante1', '#0f172a', 'bold 20px Arial', 'left', '_x6', '_y6');

      // 4. Acompañante 2
      dibujarTexto('acompanante2', '#0f172a', 'bold 22px Arial', 'left', '_x', '_y');
      dibujarTexto('acompanante2', '#0f172a', 'bold 20px Arial', 'left', '_x2', '_y2');
      dibujarTexto('acompanante2', '#0f172a', 'bold 20px Arial', 'left', '_x3', '_y3');
      dibujarTexto('acompanante2', '#0f172a', 'bold 20px Arial', 'left', '_x4', '_y4');
      dibujarTexto('acompanante2', '#0f172a', 'bold 20px Arial', 'left', '_x5', '_y5');

      // Resto de datos
      dibujarTexto('lectura', '#1e40af', 'italic 20px Arial');
      dibujarTexto('himnoInicial', '#0f172a', 'bold 22px Arial');
      dibujarTexto('himnoFinal', '#0f172a', 'bold 22px Arial');
      dibujarTexto('familiaOracion', '#15803d', '20px Arial');
      
      if (document.getElementById('adoracionInfantil').value) {
        dibujarTexto('adoracionInfantil', '#15803d', '20px Arial');
      }
      
      dibujarTexto('mensajeMusical', '#15803d', '20px Arial');
    }

    // EXPORTAR IMAGEN COMPATIBLE CON IPHONE, ANDROID Y PC
    function exportarJPG() {
      actualizarVistaPrevia();
      
      const esIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

      if (esIOS) {
        const dataUrl = canvas.toDataURL('image/jpeg', 1.0);
        const nuevaVentana = window.open();
        if (nuevaVentana) {
          nuevaVentana.document.write(`
            <html>
              <head>
                <title>Liturgia HD</title>
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <style>
                  body { margin: 0; background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; color: white; font-family: sans-serif; text-align: center; padding: 15px; box-sizing: border-box; }
                  img { max-width: 100%; height: auto; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
                  p { margin-top: 15px; font-size: 14px; color: #cbd5e1; }
                </style>
              </head>
              <body>
                <img src="${dataUrl}" alt="Liturgia">
                <p>📲 <b>Mantén presionada la imagen</b> y selecciona <b>"Guardar en Fotos"</b>.</p>
              </body>
            </html>
          `);
        } else {
          alert('Por favor, permite las ventanas emergentes en Safari para guardar la imagen.');
        }
      } else {
        const fechaVal = document.getElementById('fecha').value || 'liturgia';
        const enlace = document.createElement('a');
        enlace.download = `Liturgia_${fechaVal.replace(/\s+/g, '_')}.jpg`;
        enlace.href = canvas.toDataURL('image/jpeg', 1.0);
        enlace.click();
      }
    }

    // ENVIAR POR WHATSAPP
    async function enviarWhatsApp() {
      actualizarVistaPrevia();
      const fechaRaw = document.getElementById('fecha').value;
      let fechaVal = '';
      
      if (fechaRaw) {
        const partes = fechaRaw.split('-');
        const fechaObj = new Date(partes[0], partes[1] - 1, partes[2]);
        fechaVal = fechaObj.toLocaleDateString('es-ES', { day: 'numeric', month: 'long' });
      }

      const predicadorVal = document.getElementById('predicador').value || '';
      const lecturaVal = document.getElementById('lectura').value || '';

      let mensaje = `📋 *LITURGIA DEL CULTO*\n`;
      if (fechaVal) mensaje += `📅 *Fecha:* ${fechaVal}\n`;
      if (predicadorVal) mensaje += `🎙️ *Predicador:* ${predicadorVal}\n`;
      if (lecturaVal) mensaje += `📖 *Lectura:* ${lecturaVal}\n`;
      mensaje += `\n📌 _Se adjunta la imagen con la programación completa._`;

      const numeroRaw = document.getElementById('numeroWA').value.trim();
      const numero = numeroRaw.replace(/[^0-9]/g, '');

      canvas.toBlob(async (blob) => {
        if (!blob) {
          exportarJPG();
          return;
        }

        const archivoImagen = new File([blob], `Liturgia_${fechaVal || 'culto'}.png`, { type: 'image/png' });

        if (navigator.canShare && navigator.canShare({ files: [archivoImagen] })) {
          try {
            await navigator.share({
              files: [archivoImagen],
              title: 'Liturgia del Culto',
              text: mensaje
            });
          } catch (err) {
            console.log('Compartir cancelado o no soportado:', err);
          }
        } 
        else if (navigator.clipboard && window.ClipboardItem) {
          try {
            const item = new ClipboardItem({ 'image/png': blob });
            await navigator.clipboard.write([item]);
            alert('¡Imagen HD copiada al portapapeles! Al abrir WhatsApp presiona Pegar.');
          } catch (e) {
            exportarJPG();
          }

          const mensajeURLEncoded = encodeURIComponent(mensaje);
          let urlWA = numero 
            ? `https://wa.me/${numero}?text=${mensajeURLEncoded}`
            : `https://api.whatsapp.com/send?text=${mensajeURLEncoded}`;

          window.open(urlWA, '_blank');
        } 
        else {
          exportarJPG();
          const mensajeURLEncoded = encodeURIComponent(mensaje);
          let urlWA = numero 
            ? `https://wa.me/${numero}?text=${mensajeURLEncoded}`
            : `https://api.whatsapp.com/send?text=${mensajeURLEncoded}`;

          window.open(urlWA, '_blank');
        }
      }, 'image/png');
    }
  </script>
</body>
</html>
